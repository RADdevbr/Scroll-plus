name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmoothScroll.sln

      - name: Build
        run: dotnet build SmoothScroll.sln -c Release --no-restore

      # Produce a self-contained, single-file SmoothScroll.exe (no .NET install
      # required on the target machine) and publish it as a downloadable artifact.
      - name: Publish single-file exe
        run: >
          dotnet publish SmoothScroll/SmoothScroll.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload SmoothScroll.exe (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SmoothScroll-win-x64
          path: publish/SmoothScroll.exe
          if-no-files-found: error

      # On pushes to main (i.e. after a merge), also publish a rolling "latest"
      # GitHub Release with the exe attached, so there is a permanent, public
      # download link on the repository's Releases page.
      - name: Publish GitHub Release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SmoothScroll (latest build)
          body: Self-contained single-file Windows x64 build of SmoothScroll.
          files: publish/SmoothScroll.exe
          fail_on_unmatched_files: true
